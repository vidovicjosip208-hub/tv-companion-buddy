    <script>
      // Register the install-only service worker only in the published app,
      // never in dev or Lovable preview (previews must always get fresh code).
      (function () {
        if (!("serviceWorker" in navigator)) return;
        var host = window.location.hostname;
        var isPreview =
          host.startsWith("id-preview--") ||
          host.startsWith("preview--") ||
          host === "lovableproject.com" ||
          host.endsWith(".lovableproject.com") ||
          host.endsWith(".lovableproject-dev.com") ||
          host.endsWith(".beta.lovable.dev") ||
          host === "localhost" ||
          host === "127.0.0.1";
        var swOff = new URLSearchParams(window.location.search).has("sw");
        var inIframe = window.self !== window.top;
        if (isPreview || swOff || inIframe) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) {
              if (r.active && r.active.scriptURL.endsWith("/sw.js")) r.unregister();
            });
          });
          return;
        }
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js");
        });
      })();
    </script>
